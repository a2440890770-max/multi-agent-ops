name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Verify Drizzle snapshot matches table definitions
        run: |
          npm run db:generate
          git diff --exit-code -- backend/drizzle
  authentication:
    name: authentication and authorization
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg16-bookworm
        env:
          POSTGRES_USER: test_initializer
          POSTGRES_PASSWORD: ci-synthetic-password
          POSTGRES_DB: auth_test_012345abcdef
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_initializer -d auth_test_012345abcdef"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build --workspace=shared
      - run: npm run auth:test
        env:
          AUTH_TEST_DATABASE_URL: postgresql://test_initializer:ci-synthetic-password@127.0.0.1:5432/auth_test_012345abcdef
  task-creation:
    name: task persistence and mock execution
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg16-bookworm
        env:
          POSTGRES_USER: test_initializer
          POSTGRES_PASSWORD: ci-synthetic-password
          POSTGRES_DB: tasks_test_012345abcdef
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_initializer -d tasks_test_012345abcdef"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build --workspace=shared
      - run: npm run tasks:test
        env:
          TASK_TEST_DATABASE_URL: postgresql://test_initializer:ci-synthetic-password@127.0.0.1:5432/tasks_test_012345abcdef
      - run: npm exec -- playwright install --with-deps chromium
      - name: Verify browser task flow with isolated PostgreSQL
        run: npm run test:e2e -- tests/e2e/tasks-real.spec.ts
        env:
          CI: 'true'
          TASK_E2E_ADMIN_URL: postgresql://test_initializer:ci-synthetic-password@127.0.0.1:5432/postgres
  smoke:
    name: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run env:setup
      - run: npm run db:migrate
      - run: npm run db:migrate
      - run: npm run db:test
      - run: npm run db:check
      - name: Verify volume survives container recreation
        run: |
          docker compose --env-file .env -f infra/docker-compose.yml exec -T postgres sh -c 'psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "CREATE TABLE d1_persistence_probe (id integer PRIMARY KEY); INSERT INTO d1_persistence_probe VALUES (42);"'
          npm run db:down
          npm run db:up
          actual=$(docker compose --env-file .env -f infra/docker-compose.yml exec -T postgres sh -c 'psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc "SELECT id FROM d1_persistence_probe"')
          test "$actual" = "42"
          docker compose --env-file .env -f infra/docker-compose.yml exec -T postgres sh -c 'psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "DROP TABLE d1_persistence_probe"'
      - run: npm exec -- playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          EXPECT_DATABASE_READY: '1'
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: smoke-failure
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      - name: Stop development database
        if: always()
        run: npm run db:down
