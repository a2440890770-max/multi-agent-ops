name: multi-agent-ops-memory
services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg16-bookworm@sha256:7b822b0aac60967beb1ea5e576b8602c94c300a157d187f385ae3e0da199b90a
    environment:
      POSTGRES_DB: ${MEM0_POSTGRES_DB:?请先运行 npm run memory:setup}
      POSTGRES_USER: ${MEM0_POSTGRES_USER:?请先运行 npm run memory:setup}
      POSTGRES_PASSWORD: ${MEM0_POSTGRES_PASSWORD:?请先运行 npm run memory:setup}
    ports:
      - '127.0.0.1:${MEM0_POSTGRES_PORT:-55432}:5432'
    volumes:
      - memory_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped
volumes:
  memory_postgres_data:
